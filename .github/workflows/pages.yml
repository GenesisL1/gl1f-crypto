name: Deploy site to GitHub Pages
# GL1F Crypto is a static site: this only publishes the site/ folder as it is (any static host works the same way).
# Manual: run it from the Actions tab if this repository should also serve the site on GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
